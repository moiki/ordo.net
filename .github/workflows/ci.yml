name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ordo.slnx

      - name: Build
        run: dotnet build Ordo.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Ordo.slnx -c Release --no-build

      - name: Format check
        run: dotnet format Ordo.slnx --verify-no-changes
